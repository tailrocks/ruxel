min_version = { hard = "2026.11.1", soft = "2026.11.4" }

[tools]
# Operator repository standard. rust-toolchain.toml mirrors this rust
# entry exactly; generated CI reads every version in this table.
mr-boxington = { version = "1.30.0", workflow = "release.yml@refs/heads/main" }
# Targets: the standard's gnu pair plus x86_64-unknown-linux-musl, because
# the ruxel-agent binary pushed to servers must be static.
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
], mr_boxington = true }
cargo-binstall = "1.26.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-zigbuild" = "0.24.1"
zig = "0.17.1"
hk = "2.12.0"
gitleaks = "8.30.1"
rumdl = "0.3.2"
"cargo:alint" = "0.21.1"
pkl = "0.33.0"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target"
run = "cargo build --workspace --all-targets --all-features --locked"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks."fmt-fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Unit and integration tests"
# One chained command, not an array: the generated lane binds exactly one command
# to the "Unit and integration tests" step, so provisioning split into its own
# array item would never run in CI (the dual-evaluator check job is the only
# consumer that executes every array item). The mandatory dual-evaluator suite
# (crates/ruxel/ruxel-config/tests/dual_evaluator.rs) needs the official Pkl CLI,
# which Velnor's closed pinned-tool set does not cover, so the lane's own command
# installs it into the default data dir ($HOME/.local/share/mise/installs/pkl/*/pkl)
# and verifies it: the version is repeated because Velnor executes
# task commands with MISE_NO_CONFIG=1 and MISE_LOCKFILE=0: the [tools] pin and the
# lockfile setting are invisible there, and `--locked` fails with "locked mode
# requires lockfile to be enabled"; the explicit X.Y.Z also avoids @latest
# resolution. Because MISE_LOCKFILE=0 also hides the committed checksums,
# tools/verify-pkl-artifact hashes the installed binary against the mise.lock
# entry for this platform and refuses a mismatch before any test executes it.
run = "mise install pkl@0.33.0 && tools/verify-pkl-artifact && cargo nextest run --workspace --all-features --locked --no-tests=pass"

[tasks."dual-evaluator"]
description = "Dual-evaluator suite under the official Pkl CLI provisioned from the mise pin"
run = [
  # Same constraints as the test task above: no config and no lockfile under the
  # generated executor, so pin the exact version instead of relying on
  # [tools]/mise.lock, then verify the artifact against the committed checksum.
  "mise install pkl@0.33.0",
  "tools/verify-pkl-artifact",
  "cargo test --locked -p ruxel-config --test dual_evaluator",
]

[tasks.doctest]
description = "Doctests (nextest does not run them)"
run = "cargo test --workspace --doc --all-features --locked"

[tasks.deny]
description = "Licenses, bans, sources and advisories"
run = "cargo deny --locked check"

[tasks."deny-ci"]
description = "Verify cargo-deny CI inputs and run cargo-deny"
run = [
  "cargo run --locked -p ruxel-config --bin check-deny-inputs",
  "cargo deny --locked check",
]

[tasks.machete]
description = "Unused dependencies"
run = "cargo machete"

[tasks.policy]
description = "Repository policy (alint, rust-strict-v1)"
run = ["alint validate-config", "alint check --fail-on-warning"]

[tasks."acceptance-local"]
description = "Safe native Pkl acceptance against actual local agent subprocesses"
run = [
  "cargo build --locked -p ruxel -p ruxel-agent 1>&2",
  "perl -T -MConfig -MFcntl -MMath::BigInt -MPOSIX -e 1 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-xfs/Cargo.toml 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-plan/Cargo.toml 1>&2",
  "cargo build --locked --manifest-path tools/http-fixture/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-plan/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --http-fixture tools/http-fixture/target/debug/ruxel-http-fixture 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-manifest/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-manifest/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --scenario check-semantics --scenario multihost --scenario controller-delegation 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-manifest/Cargo.toml --example secret_dedup -- target/debug/ruxel target/debug/ruxel-agent 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-manifest/Cargo.toml --example secret_generation -- target/debug/ruxel target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-pty/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-pty/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-control/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-control/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-files/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-files/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --asset testdata/workloads/pr66/assets/template.pkl 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-copy/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-copy/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-cache/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-cache/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-isolation/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-isolation/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-runtime/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-runtime/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
]

[tasks.check]
description = "Every local check; run before each commit"
depends = [
  "fmt",
  "lint",
  "test",
  "doctest",
  "deny",
  "machete",
  "policy",
  "acceptance-local",
]

[tasks.ci]
description = "Fresh-checkout aggregate: install, build, check"
run = ["mise run install", "mise run build", "mise run check"]

[tasks.agent]
description = "Static musl ruxel-agent for x86_64 Linux hosts"
run = "tools/build-libblkid -- cargo zigbuild --target x86_64-unknown-linux-musl -p ruxel-agent --release --locked"
