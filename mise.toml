min_version = { hard = "2026.11.1", soft = "2026.11.4" }

[tools]
# Operator repository standard. rust-toolchain.toml mirrors this rust
# entry exactly; generated CI reads every version in this table.
mr-boxington = { version = "1.30.0", workflow = "release.yml@refs/heads/main" }
# Targets: the standard's gnu pair plus x86_64-unknown-linux-musl, because
# the ruxel-agent binary pushed to servers must be static.
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
], mr_boxington = true }
cargo-binstall = "1.26.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-zigbuild" = "0.24.1"
zig = "0.17.1"
hk = "2.12.0"
gitleaks = "8.30.1"
rumdl = "0.3.2"
"cargo:alint" = "0.21.1"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target"
run = "cargo build --workspace --all-targets --all-features --locked"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks."fmt-fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Unit and integration tests"
# Local task only: the generated "Unit and integration tests" lane does not
# execute this task — Velnor's rust adapter synthesizes its own nextest command
# from the stack config, so nothing here runs in CI. The chain provisions the
# official Pkl CLI for the mandatory dual-evaluator suite
# (crates/ruxel/ruxel-config/tests/dual_evaluator.rs), which Velnor's closed
# pinned-tool set cannot express; the suite is gated behind ruxel-config's
# `dual-evaluator` feature (--all-features here enables it) so the pkl-less
# lanes skip it instead of failing, and CI runs it in the dedicated
# dual-evaluator check. pkl is a tool of the tasks that use it, never a
# global one: a globally prepared pkl breaks `mise run` on macOS x86_64,
# where upstream publishes no artifact, and only the tasks that execute
# the official CLI need it at all. Each such task provisions it with its
# own `mise install pkl@0.33.0` run step — the per-task scope — because a
# mise task `tools` entry is invisible under the generated executor
# (`mise run --skip-tools`) and outside Velnor's mise-task contract. The
# version is repeated because task commands execute with MISE_NO_CONFIG=1
# and MISE_LOCKFILE=0: the [tools] pin and the lockfile are invisible
# there (and `--locked` alone fails with "locked mode requires lockfile to
# be enabled"), so the install step re-enables both for itself
# (MISE_NO_CONFIG=0 MISE_LOCKFILE=1) and runs `mise install --locked
# pkl@0.33.0`: locked mode consumes the mise.lock URL and checksum for
# the current platform and never resolves Aqua registry metadata — which
# on an x86_64-musl host would install the glibc pkl-linux-amd64 (Aqua's
# template has no musl override) instead of the committed Alpine asset
# pinned by the hand-corrected `platforms.linux-x64-musl` slot. The
# explicit X.Y.Z also avoids @latest resolution. `--locked` fails with
# "No lockfile URL found" on a platform mise.lock carries no slot for
# (macOS x86_64, linux-arm64-musl), and the `||` hands that verdict to
# tools/verify-pkl-artifact, which hashes the installed binary against
# the mise.lock entry for this platform and refuses a mismatch before any
# test executes it; on success it prints the absolute path of the artifact
# it hashed, which is exported as RUXEL_PKL so the dual-evaluator suite
# executes exactly the verified binary. On macOS x86_64 it answers exit 3
# (unsupported platform) — official pkl ships no macOS x86_64 artifact
# since 0.32.2, and 0.33.0 has only pkl-macos-aarch64 — so an Intel Mac is
# never told that its pkl is missing or tampered.
run = 'MISE_NO_CONFIG=0 MISE_LOCKFILE=1 mise install --locked pkl@0.33.0 || tools/verify-pkl-artifact && pkl_verified=$(tools/verify-pkl-artifact) && RUXEL_PKL="$pkl_verified" cargo nextest run --workspace --all-features --locked --no-tests=pass'

[tasks."dual-evaluator"]
description = "Dual-evaluator suite under the official Pkl CLI provisioned by this task's own install step; the verifier refuses a binary that does not match the committed checksum, and answers macOS x86_64 with exit 3 (unsupported platform): official pkl ships no macOS x86_64 artifact since 0.32.2, and 0.33.0 has only pkl-macos-aarch64"
run = [
  # Same constraints as the test task above: the generated executor hides config
  # and lockfile, so pin the exact version inline, and re-enable both for the
  # install step so `mise install --locked pkl@0.33.0` consumes the mise.lock
  # URL for the current platform — the x86_64-musl slot pins the Alpine asset,
  # where Aqua registry metadata would install the glibc one — then verify the
  # artifact against the committed checksum. A failed install is handed to the
  # verifier, which names the platform's verdict: on macOS x86_64 upstream
  # publishes no artifact (and mise.lock carries no slot), so the verifier
  # answers exit 3 (unsupported platform) instead of mise's raw install error.
  "MISE_NO_CONFIG=0 MISE_LOCKFILE=1 mise install --locked pkl@0.33.0 || tools/verify-pkl-artifact",
  # Verification and execution share one resolver: the verifier prints the
  # absolute path of the artifact it hashed on stdout, and that exact path
  # is exported as RUXEL_PKL — the suite executes the hashed binary and
  # refuses to run without a verified path, so a different pkl on PATH can
  # never displace the verified artifact.
  # The feature flag is what lets this task see the target at all: the suite is
  # gated behind required-features so the pkl-less rust lanes skip it, and this
  # task is CI's mandatory runner for it.
  'pkl_verified=$(tools/verify-pkl-artifact) && RUXEL_PKL="$pkl_verified" cargo test --locked -p ruxel-config --features dual-evaluator --test dual_evaluator',
]

[tasks.doctest]
description = "Doctests (nextest does not run them)"
run = "cargo test --workspace --doc --all-features --locked"

[tasks.deny]
description = "Licenses, bans, sources and advisories"
run = "cargo deny --locked check"

[tasks."deny-ci"]
description = "Verify cargo-deny CI inputs and run cargo-deny"
run = [
  "cargo run --locked -p ruxel-config --bin check-deny-inputs",
  "cargo deny --locked check",
]

[tasks.machete]
description = "Unused dependencies"
run = "cargo machete"

[tasks.policy]
description = "Repository policy (alint, rust-strict-v1)"
run = ["alint validate-config", "alint check --fail-on-warning"]

[tasks."acceptance-local"]
description = "Safe native Pkl acceptance against actual local agent subprocesses"
run = [
  "cargo build --locked -p ruxel -p ruxel-agent 1>&2",
  "perl -T -MConfig -MFcntl -MMath::BigInt -MPOSIX -e 1 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-xfs/Cargo.toml 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-plan/Cargo.toml 1>&2",
  "cargo build --locked --manifest-path tools/http-fixture/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-plan/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --http-fixture tools/http-fixture/target/debug/ruxel-http-fixture 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-manifest/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-manifest/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --scenario check-semantics --scenario multihost --scenario controller-delegation 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-manifest/Cargo.toml --example secret_dedup -- target/debug/ruxel target/debug/ruxel-agent 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-manifest/Cargo.toml --example secret_generation -- target/debug/ruxel target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-pty/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-pty/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-control/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-control/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-files/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-files/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --asset testdata/workloads/pr66/assets/template.pkl 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-copy/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-copy/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-cache/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-cache/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-isolation/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-isolation/Cargo.toml -- --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
  "RUSTDOC=\"$(rustc --print sysroot)/bin/rustdoc\" cargo test --locked --manifest-path tools/acceptance-runtime/Cargo.toml 1>&2",
  "cargo run --locked --manifest-path tools/acceptance-runtime/Cargo.toml -- --root . --ruxel target/debug/ruxel --agent target/debug/ruxel-agent 1>&2",
]

[tasks.check]
description = "Every local check; run before each commit"
depends = [
  "fmt",
  "lint",
  "test",
  "doctest",
  "deny",
  "machete",
  "policy",
  "acceptance-local",
]

[tasks.ci]
description = "Fresh-checkout aggregate: install, build, check"
run = ["mise run install", "mise run build", "mise run check"]

[tasks.agent]
description = "Static musl ruxel-agent for x86_64 Linux hosts"
run = "tools/build-libblkid -- cargo zigbuild --target x86_64-unknown-linux-musl -p ruxel-agent --release --locked"
