min_version = "2026.11.2"

[tools]
# Operator repository standard. rust-toolchain.toml mirrors this rust
# entry exactly; generated CI reads every version in this table.
mr-boxington = { version = "1.29.2", workflow = "release.yml@refs/heads/main" }
# Targets: the standard's gnu pair plus x86_64-unknown-linux-musl, because
# the ruxel-agent binary pushed to servers must be static.
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
], mr_boxington = true }
cargo-binstall = "1.26.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-zigbuild" = "0.24.1"
zig = "0.17.1"
hk = "2.11.1"
gitleaks = "8.30.1"
rumdl = "0.3.2"
"cargo:alint" = "0.21.1"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target"
run = "cargo build --workspace --all-targets --all-features --locked"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks."fmt-fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Unit and integration tests"
run = "cargo nextest run --workspace --all-features --locked --no-tests=pass"

[tasks.doctest]
description = "Doctests (nextest does not run them)"
run = "cargo test --workspace --doc --all-features --locked"

[tasks.deny]
description = "Licenses, bans, sources and advisories"
run = "cargo deny --locked check"

[tasks."deny-ci"]
description = "Verify cargo-deny CI inputs and run cargo-deny"
run = ["python3 tools/ci/check-deny-inputs.py", "cargo deny --locked check"]

[tasks.machete]
description = "Unused dependencies"
run = "cargo machete"

[tasks.policy]
description = "Repository policy (alint, rust-strict-v1)"
run = ["alint validate-config", "alint check --fail-on-warning"]

[tasks."acceptance-local"]
description = "Safe native Pkl acceptance against actual local agent subprocesses"
run = [
  "cargo build --locked -p ruxel -p ruxel-agent",
  "python3 -B -m unittest discover -s tests/acceptance/pr66 -p test_coverage.py",
  "python3 -B -m unittest discover -s tests/acceptance/pr66 -p test_expectations_runner.py",
  "python3 -I -S crates/ruxel/ruxel-agent/src/modules/filesystem/test_xfs.py",
  "python3 -B tests/acceptance/pr66/coverage.py",
  "python3 -B tests/acceptance/pr66/plan_matrix.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/expectations_runner.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent --scenario check-semantics --scenario multihost --scenario controller-delegation",
  "python3 -B tests/acceptance/pr66/check_semantics.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/check_overrides.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/cache.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/files_lifecycle.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/retry.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/control_runtime.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/handler_failure.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/nested_loops.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/scoped_variables.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/template_source.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/copy_binary.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/copy_force.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/secret_provenance.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/repeated_actions.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/host_isolation.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/handshake_isolation.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/post_handshake_isolation.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/partial_recap.py --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/local_scenarios.py multihost --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
  "python3 -B tests/acceptance/pr66/local_scenarios.py controller-delegation --ruxel target/debug/ruxel --agent target/debug/ruxel-agent",
]

[tasks.check]
description = "Every local check; run before each commit"
depends = [
  "fmt",
  "lint",
  "test",
  "doctest",
  "deny",
  "machete",
  "policy",
  "acceptance-local",
]

[tasks.ci]
description = "Fresh-checkout aggregate: install, build, check"
run = ["mise run install", "mise run build", "mise run check"]

[tasks.agent]
description = "Static musl ruxel-agent for x86_64 Linux hosts"
run = "tools/build-libblkid -- cargo zigbuild --target x86_64-unknown-linux-musl -p ruxel-agent --release --locked"
