min_version = "2026.11.2"

[tools]
# Operator repository standard. rust-toolchain.toml mirrors this rust
# entry exactly; generated CI reads every version in this table.
mr-boxington = { version = "1.29.2", workflow = "release.yml@refs/heads/main" }
# Targets: the standard's gnu pair plus x86_64-unknown-linux-musl, because
# the ruxel-agent binary pushed to servers must be static.
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
], mr_boxington = true }
cargo-binstall = "1.26.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-zigbuild" = "0.24.1"
zig = "0.17.1"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target with a real codegen build"
run = "cargo build --all-targets --all-features --locked"

[tasks.test]
run = "cargo nextest run --all-features --color=always --no-tests=pass"

[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all --check"

[tasks."fmt-fix"]
run = "cargo fmt --all"

[tasks.ci]
description = "Local aggregate of install, build, test, lint, and fmt"
depends = ["install", "build", "test", "lint", "fmt"]
