[tools]
cargo-binstall = "1.21.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-zigbuild" = "0.23.0"
uv = "0.11.14"
zig = "0.16.0"

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]
cargo.binstall_only = true
cargo.binstall_quickinstall = true

[tasks.ci]
depends = ["build", "test", "lint", "fmt"]

[tasks.build]
run = "cargo build --all-targets --all-features --locked"

[tasks.test]
run = "cargo nextest run --all-features --color=always --no-tests=pass"

[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all --check"
