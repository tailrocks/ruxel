schema = 1

[workflow]
policy = "consumer-v1"
default_branch = "main"
crate_timeout_minutes = 20


[workflow.verify]
jobs = ["alint"]

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"

[[stacks.rust.inputs]]
globs = [
  "crates/ruxel/ruxel-agent/src/modules/filesystem/tests/xfs.rs",
  "crates/ruxel/ruxel-agent/src/modules/filesystem/tests/xfs_perl.rs",
  "crates/ruxel/ruxel-agent/src/modules/filesystem/tests/xfs_synthetic.pl",
  "crates/ruxel/ruxel-agent/src/modules/filesystem/xfs.pl",
  "crates/ruxel/ruxel-agent/src/modules/filesystem/xfs.rs",
]
packages = ["ruxel-acceptance-xfs"]

[[stacks.rust.inputs]]
globs = [
  "crates/ruxel/ruxel-config/tests/dual_evaluator.rs",
  "crates/ruxel/ruxel-config/tests/dual_evaluator_systemd.rs",
  "mise.lock",
  "schema/ruxel/**/*.pkl",
  "tests/schema/valid.pkl",
  "tests/workflow/**/*.pkl",
  "testdata/workloads/pr66/*.pkl",
  "testdata/workloads/pr66/assets/template.pkl",
  "tools/verify-pkl-artifact",
]
packages = ["ruxel-config"]

[[checks]]
id = "cargo-deny"
task = "deny-ci"
inputs = ["Cargo.lock", "Cargo.toml", "crates/ruxel/ruxel-proto/Cargo.toml", "crates/ruxel/ruxel/Cargo.toml", "crates/ruxel/ruxel-agent/Cargo.toml", "crates/ruxel/ruxel-config/Cargo.toml", "crates/ruxel/ruxel-engine/Cargo.toml", "crates/ruxel/ruxel-guard/Cargo.toml", "crates/ruxel/ruxel-config/src/bin/check_deny_inputs.rs", "crates/ruxel/ruxel-config/src/bin/check_deny_inputs/tests.rs", "deny.toml", "mise.toml", "mise.lock"]
tools = ["rust", "cargo-deny"]
timeout_minutes = 10
[checks.runner]
label = "ubuntu-26.04"
platform = "linux_x64"
executor = "hosted"

