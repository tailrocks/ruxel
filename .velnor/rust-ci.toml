[[lint]]
kind = "jactionlint"
config = ".github/jactionlint.yaml"

[[lint]]
kind = "alint"
config = ".alint.yml"

# The generator check itself has no native equivalent: it must stay green.
[[lint]]
kind = "mise-task"
id = "generated-workflows"
name = "Generated workflows"
task = "check-generated-workflows"
tools = ["github:tailrocks/velnor-new", "rust", "mr-boxington"]
timeout_minutes = 10

# No native equivalent: needs the official Pkl CLI, which the closed pinned
# tool set cannot express, so the mise task provisions it via
# tools/verify-pkl-artifact (see the task comments).
[[lint]]
kind = "mise-task"
id = "dual-evaluator"
name = "Dual evaluator"
task = "dual-evaluator"
tools = ["rust"]
timeout_minutes = 20

# No native equivalent: native lanes run nextest per crate, while this task
# drives the built binaries through end-to-end acceptance scenarios.
[[lint]]
kind = "mise-task"
id = "acceptance-local"
name = "Acceptance local"
task = "acceptance-local"
tools = ["rust"]
timeout_minutes = 30
