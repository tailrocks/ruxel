# velnor-gen input. `velnor-gen generate` writes .github/workflows/rust-ci.yml
# (plus rust-cache-trim.yml) and .velnor/rust-metadata.json from this file;
# `velnor-gen check` (mise task check-generated-workflows, hk hook, CI job)
# fails on drift. Full reference: generator/CONFIG.md in tailrocks/velnor-new.
#
# Migration note: this replaces the old velnor-actions 0.1.80 setup
# (.velnor/config.toml + release-manifest.json -> ci.yml, state-seal.yml,
# cache-prune.yml). Every old ci.yml job is covered: the root workspace and
# the 13 standalone tool roots below via Rust lanes, cargo-deny via the
# policy job (deny.toml), cargo-machete via the policy job (mise pin),
# dual-evaluator and acceptance-local via [[lint]] mise tasks, Alint and
# Jactionlint via [[lint]]. Dropped with no replacement: state-seal.yml
# (old-engine state attestation, no velnor-gen equivalent) and
# cache-prune.yml (superseded by generator-owned rust-cache-trim.yml).

default_branch = "main"
runner = "ubuntu-26.04-scale-set"
hosted = false
required_check = "Required"
mbx_shared_store = true
docs = "post_merge"
check_alone = "post_merge"

[crates_mirror]
runner = "ubuntu-26.04-scale-set"
registry = "sparse+https://crates-mirror.velnor-system.svc.cluster.local/index/"
cainfo = "/opt/velnor/crates-mirror/ca-bundle.pem"

# Cargo.lock pins pklr from public git repositories at full commits: the
# default dependency from jdx/pklr and ruxel-config's feature-gated upstream
# path from donbeave/pklr (a fork of it). Declaring them lets the base caches
# save and the pull-request deltas work.
[public_sources]
git = ["https://github.com/donbeave/pklr", "https://github.com/jdx/pklr"]

# The 13 standalone tool workspaces share one job set and one build folder
# (target-velnor/tools), as CONFIG.md intends for many small workspaces.
# The root workspace (ruxel, ruxel-agent, ruxel-config, ruxel-engine,
# ruxel-guard, ruxel-proto) keeps its own jobs.
[[workspace_groups]]
name = "tools"
roots = [
  "tools/acceptance-cache",
  "tools/acceptance-control",
  "tools/acceptance-copy",
  "tools/acceptance-files",
  "tools/acceptance-isolation",
  "tools/acceptance-manifest",
  "tools/acceptance-plan",
  "tools/acceptance-pty",
  "tools/acceptance-restart-rootless",
  "tools/acceptance-runtime",
  "tools/acceptance-xfs",
  "tools/control-flow-assertions",
  "tools/http-fixture",
]

# Files outside any Cargo root, mapped to the package whose tests read them
# (mirrors the old [[stacks.rust.inputs]] selection). Input globs are literal
# paths or a trailing `/**` only: a `*` inside a segment is refused. The
# ruxel-config test suites walk tests/workflow wholesale, so the whole tree
# maps there; schema holds only .pkl files.
[[inputs]]
glob = "crates/ruxel/ruxel-agent/src/modules/filesystem/tests/xfs.rs"
packages = ["ruxel-acceptance-xfs"]

[[inputs]]
glob = "crates/ruxel/ruxel-agent/src/modules/filesystem/tests/xfs_perl.rs"
packages = ["ruxel-acceptance-xfs"]

[[inputs]]
