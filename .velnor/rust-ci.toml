# libblkid build scripts feed the static ruxel-agent binary (mise run agent).
[[inputs]]
glob = "tools/build-libblkid"
packages = ["ruxel-agent"]

[[inputs]]
glob = "tools/build-libblkid-source"
packages = ["ruxel-agent"]

[[inputs]]
glob = "tools/pkg-config-libblkid"
packages = ["ruxel-agent"]

[[lint]]
kind = "jactionlint"
config = ".github/jactionlint.yaml"

[[lint]]
kind = "alint"
config = ".alint.yml"

# The generator check itself has no native equivalent: it must stay green.
[[lint]]
kind = "mise-task"
id = "generated-workflows"
name = "Generated workflows"
task = "check-generated-workflows"
tools = ["github:tailrocks/velnor-new", "rust", "mr-boxington"]
timeout_minutes = 10

# No native equivalent: needs the official Pkl CLI, which the closed pinned
# tool set cannot express, so the mise task provisions it via
# tools/verify-pkl-artifact (see the task comments).
[[lint]]
kind = "mise-task"
id = "dual-evaluator"
name = "Dual evaluator"
task = "dual-evaluator"
tools = ["rust"]
timeout_minutes = 20

# Acceptance local moved to .velnor/workflows.toml: [[lint]] cannot
# select a runner, and the task needs hosted ubuntu-26.04 (get_url
# refuses the scale-set overlayfs). The declared acceptance-local.yml
# workflow runs the same mise task on the hosted runner; keep its job
# required in the branch ruleset so the gate stays as strong.
