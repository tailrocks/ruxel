# Filesystem-trust tests run on a GitHub-hosted runner: the scale-set
# pods check out onto overlayfs (0x794c7630), which the production
# fs-allowlist refuses, while hosted ext4 passes. Moving the tests (not
# weakening the allowlist) is the fix. The filter names every test that
# failed for this reason in runs 45116130760 and 45136005935; the
# default lane leaves them out and `velnor-ci test-groups check`
# enforces the disjointness at build time.
[[test_groups]]
name = "trusted-fs"
root = "."
runner = "ubuntu-26.04"
hosted = true
needs = ["cargo"]
filter = "package(ruxel-guard) and (test(mux::tests::rejects_untrusted_ancestor_and_final_symlink) or test(target::directory_tests::rejects_existing_directory_with_group_access) or test(target::long_path_test::rejects_long_socket_path_before_ssh) or test(target::tests::admission_uses_simulated_ssh_only_for_allowed_hosts) or test(target::tests::all_policy_refusals_precede_admission_effects) or test(target::tests::untrusted_known_hosts_are_refused_before_ssh) or test(trusted_path::tests::identity_requires_existing_trusted_regular_file) or test(trusted_path::tests::platform::linux::precreation_caps_inherited_named_user_write_permissions) or test(trusted_path::tests::precreates_private_file_and_keeps_existing_keys) or test(trusted_path::tests::rejects_final_symlink_directory_and_symlink_ancestor) or test(trusted_path::tests::rejects_parent_traversal_before_creation) or test(trusted_path::tests::rejects_writable_file_and_ancestor_without_repairing_them) or test(allowed_host_is_admitted_by_local_ssh_configuration)) or package(ruxel-agent) and (test(modules::get_url::client::tests::system_executable_resolves_to_an_absolute_trusted_path) or test(modules::get_url::download_tests::clients::trusted_absolute_client_resolution_ignores_task_path)) or package(ruxel) and binary(exit_classification) or package(ruxel-engine) and test(~transport::tests::deployment)"
no_tests = "pass"

[[lint]]
kind = "jactionlint"
config = ".github/jactionlint.yaml"

[[lint]]
kind = "alint"
config = ".alint.yml"

# The generator check itself has no native equivalent: it must stay green.
[[lint]]
kind = "mise-task"
id = "generated-workflows"
name = "Generated workflows"
task = "check-generated-workflows"
tools = ["github:tailrocks/velnor-new", "rust", "mr-boxington"]
timeout_minutes = 10

# No native equivalent: needs the official Pkl CLI, which the closed pinned
# tool set cannot express, so the mise task provisions it via
# tools/verify-pkl-artifact (see the task comments).
[[lint]]
kind = "mise-task"
id = "dual-evaluator"
name = "Dual evaluator"
task = "dual-evaluator"
tools = ["rust"]
timeout_minutes = 20

# Acceptance local moved to .velnor/workflows.toml: [[lint]] cannot
# select a runner, and the task needs hosted ubuntu-26.04 (get_url
# refuses the scale-set overlayfs). The declared acceptance-local.yml
# workflow runs the same mise task on the hosted runner; keep its job
# required in the branch ruleset so the gate stays as strong.

[[inputs]]
glob = "crates/ruxel/tests/fixtures/local_exit_agent.rs"
packages = ["ruxel"]

# Process-group cleanup tests spawn real shells and process trees; under
# the consolidated archive job's load they time out spuriously. Their own
# hosted job keeps them in the low-load environment they had as
# standalone tool jobs before the flat workspace merge.
[[test_groups]]
name = "process"
root = "."
runner = "ubuntu-26.04"
hosted = true
needs = ["cargo"]
filter = "package(ruxel-acceptance-isolation) or package(ruxel-acceptance-runtime) and test(~process::tests::descendants) or package(ruxel-acceptance-runtime) and test(~completed_cli_does_not_leave_descendants_running)"
no_tests = "pass"
