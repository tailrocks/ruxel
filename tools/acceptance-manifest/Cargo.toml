[package]
name = "ruxel-acceptance-manifest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["event", "fs", "process"] }

sha2 = "=0.11.1"
tempfile = "=3.27.0"

ruxel-engine = { path = "../../crates/ruxel/ruxel-engine" }
ruxel-config = { path = "../../crates/ruxel/ruxel-config" }
ruxel-proto = { path = "../../crates/ruxel/ruxel-proto" }
tokio = { version = "1", features = ["rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
