- name: Fixture XFS storage variation
  hosts: storage
  become: true
  vars:
    fixture_disks:
      - /dev/disk/by-id/ruxel-fixture-disk-1
      - /dev/disk/by-id/ruxel-fixture-disk-2
      - /dev/disk/by-id/ruxel-fixture-disk-3
  tasks:
    - name: Resolve fixture disks
      command:
        argv: [readlink, -f, "{{ item }}"]
      loop: "{{ fixture_disks }}"
      register: fixture_disk_devices
      changed_when: false
      check_mode: false

    - name: Create synthetic XFS volume group
      community.general.lvg:
        vg: ruxel_fixture_xfs
        pvs: "{{ fixture_disk_devices.results | map(attribute='stdout') | list }}"

    - name: Create synthetic XFS logical volume
      community.general.lvol:
        lv: data
        vg: ruxel_fixture_xfs
        size: +100%FREE
        resizefs: true

    - name: Format synthetic XFS volume
      filesystem:
        fstype: xfs
        dev: /dev/ruxel_fixture_xfs/data
        resizefs: true
