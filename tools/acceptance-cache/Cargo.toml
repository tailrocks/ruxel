[package]
name = "ruxel-acceptance-cache"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["event", "fs", "process"] }

tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
