      # jactionlint ignore=shellcheck
      - name: Delete the older rust-lint entries
        if: '${{ needs.rust-lint.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-lint.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-test entries
        if: '${{ needs.rust-test.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-test.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-test sources entries
        if: '${{ needs.rust-test.outputs.sources_prefix != '''' && (needs.rust-test.outputs.sources_saved == ''true'' || needs.rust-test.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-test.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-lint-target_key
        name: Verify the rust-lint target cache upload
        if: '${{ needs.rust-lint.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-lint.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-test-target_key
        name: Verify the rust-test target cache upload
        if: '${{ needs.rust-test.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-test.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-test-sources_key
        name: Verify the rust-test sources cache upload
        if: '${{ needs.rust-test.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-test.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-lint-target_key.outcome != ''failure'' && steps.verify-rust-test-target_key.outcome != ''failure'' && steps.verify-rust-test-sources_key.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      # jactionlint ignore=shellcheck
      - name: Enforce the repository cache budget
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache budget --budget-bytes 8000000000'
      # jactionlint ignore=shellcheck
      - name: Delete the private-base caches unless the repository is private
        if: '${{ !cancelled() }}'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache purge-private --if-public'
