  required:
    name: Required verdict
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env: *m3
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - check-acceptance-local
      - check-cargo-deny
      - rust-ruxel
      - rust-ruxel-acceptance-cache
      - rust-ruxel-acceptance-control
      - rust-ruxel-acceptance-copy
      - rust-ruxel-acceptance-files
      - rust-ruxel-acceptance-isolation
      - rust-ruxel-acceptance-manifest
      - rust-ruxel-acceptance-plan
      - rust-ruxel-acceptance-pty
      - rust-ruxel-acceptance-restart-rootless
      - rust-ruxel-acceptance-runtime
      - rust-ruxel-acceptance-xfs
      - rust-ruxel-agent
      - rust-ruxel-config
      - rust-ruxel-control-flow-assertions
      - rust-ruxel-engine
      - rust-ruxel-guard
      - rust-ruxel-http-fixture
      - rust-ruxel-proto
      - jactionlint
      - alint
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '1' || '2' }}
          persist-credentials: "false"
      - *s3
      - *s4
      - name: Prepare pinned tools
        run: mise --no-config --no-env --no-hooks install gh@2.103.3
      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: *m6
      - name: Download every expected matrix artifact
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_INTERNAL_OP: fetch-reports-v1
        run: *r17
      - name: Assemble group ledgers
        env:
          VELNOR_INTERNAL_OP: assemble-group-ledgers-v1
        run: *r17
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"alint\",\"check-acceptance-local\",\"check-cargo-deny\",\"jactionlint\",\"plan\",\"rust-ruxel\",\"rust-ruxel-acceptance-cache\",\"rust-ruxel-acceptance-control\",\"rust-ruxel-acceptance-copy\",\"rust-ruxel-acceptance-files\",\"rust-ruxel-acceptance-isolation\",\"rust-ruxel-acceptance-manifest\",\"rust-ruxel-acceptance-plan\",\"rust-ruxel-acceptance-pty\",\"rust-ruxel-acceptance-restart-rootless\",\"rust-ruxel-acceptance-runtime\",\"rust-ruxel-acceptance-xfs\",\"rust-ruxel-agent\",\"rust-ruxel-config\",\"rust-ruxel-control-flow-assertions\",\"rust-ruxel-engine\",\"rust-ruxel-guard\",\"rust-ruxel-http-fixture\",\"rust-ruxel-proto\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: *r17
      - name: Merge reports
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_INTERNAL_OP: merge-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"alint\",\"check-acceptance-local\",\"check-cargo-deny\",\"jactionlint\",\"plan\",\"rust-ruxel\",\"rust-ruxel-acceptance-cache\",\"rust-ruxel-acceptance-control\",\"rust-ruxel-acceptance-copy\",\"rust-ruxel-acceptance-files\",\"rust-ruxel-acceptance-isolation\",\"rust-ruxel-acceptance-manifest\",\"rust-ruxel-acceptance-plan\",\"rust-ruxel-acceptance-pty\",\"rust-ruxel-acceptance-restart-rootless\",\"rust-ruxel-acceptance-runtime\",\"rust-ruxel-acceptance-xfs\",\"rust-ruxel-agent\",\"rust-ruxel-config\",\"rust-ruxel-control-flow-assertions\",\"rust-ruxel-engine\",\"rust-ruxel-guard\",\"rust-ruxel-http-fixture\",\"rust-ruxel-proto\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: *r17
      - name: Publish final report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-final-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}/final-report.json
          retention-days: "30"
  required-gate:
    name: Required
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env: *m1
    needs:
      - required
