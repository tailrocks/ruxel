        env:
          VELNOR_TOOLS_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ needs.rust-plan.outputs.tools_anchor }}'
        run: '. "$VELNOR_EXEC" tools-local restore --key "$VELNOR_TOOLS_KEY"'
      - id: tools
        name: Restore the tools cache
        if: *velnor_10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
