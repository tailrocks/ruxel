      - rust-plan
      - rust-lint-root
      - rust-test-root
      - rust-test-default-root
      - rust-test-trusted-fs-root
      - rust-tools_acceptance_cache
      - rust-tools_acceptance_control
      - rust-tools_acceptance_copy
      - rust-tools_acceptance_files
      - rust-tools_acceptance_isolation
      - rust-tools_acceptance_manifest
      - rust-tools_acceptance_plan
      - rust-tools_acceptance_pty
      - rust-tools_acceptance_restart_rootless
      - rust-tools_acceptance_runtime
      - rust-tools_acceptance_xfs
      - rust-tools_control_flow_assertions
      - rust-tools_http_fixture
      - policy
      - lint-jactionlint
      - lint-alint
      - lint-generated-workflows
      - lint-dual-evaluator
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (always()) }}'
    permissions:
      contents: read
    cache-mode: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-latest'' }}'
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.111
        uses: tailrocks/velnor-new/actions/setup-velnor@146a9960b0b41adf6612462d28982bff2c60a1c6  # tools-v0.1.111
        with:
          version: '0.1.111'
          sha256-linux-x64: '3509a46872cabb4a3d831c9b7303a0c50553ea10c9d0fc4c45b608c7471506ed'
          sha256-linux-arm64: b36766f3f3afd30c147073ea7f2c62914b605d0daa329754906be2a7cfd41497
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-lint-root=lane:root --job rust-test-root=lane:root --job rust-test-default-root=lane:root --job rust-test-trusted-fs-root=lane:root --job rust-tools_acceptance_cache=lane:tools_acceptance_cache --job rust-tools_acceptance_control=lane:tools_acceptance_control --job rust-tools_acceptance_copy=lane:tools_acceptance_copy --job rust-tools_acceptance_files=lane:tools_acceptance_files --job rust-tools_acceptance_isolation=lane:tools_acceptance_isolation --job rust-tools_acceptance_manifest=lane:tools_acceptance_manifest --job rust-tools_acceptance_plan=lane:tools_acceptance_plan --job rust-tools_acceptance_pty=lane:tools_acceptance_pty --job rust-tools_acceptance_restart_rootless=lane:tools_acceptance_restart_rootless --job rust-tools_acceptance_runtime=lane:tools_acceptance_runtime --job rust-tools_acceptance_xfs=lane:tools_acceptance_xfs --job rust-tools_control_flow_assertions=lane:tools_control_flow_assertions --job rust-tools_http_fixture=lane:tools_http_fixture --job policy=policy --job lint-jactionlint=always --job lint-alint=always --job lint-generated-workflows=always --job lint-dual-evaluator=always --tests rust-test-default-root=root --tests rust-test-trusted-fs-root=root --tests rust-tools_acceptance_cache=tools_acceptance_cache --tests rust-tools_acceptance_control=tools_acceptance_control --tests rust-tools_acceptance_copy=tools_acceptance_copy --tests rust-tools_acceptance_files=tools_acceptance_files --tests rust-tools_acceptance_isolation=tools_acceptance_isolation --tests rust-tools_acceptance_manifest=tools_acceptance_manifest --tests rust-tools_acceptance_plan=tools_acceptance_plan --tests rust-tools_acceptance_pty=tools_acceptance_pty --tests rust-tools_acceptance_restart_rootless=tools_acceptance_restart_rootless --tests rust-tools_acceptance_runtime=tools_acceptance_runtime --tests rust-tools_acceptance_xfs=tools_acceptance_xfs --tests rust-tools_control_flow_assertions=tools_control_flow_assertions --tests rust-tools_http_fixture=tools_http_fixture'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
