name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::stable release requires existing v* tag"; exit 1;; esac
          version=${GITHUB_REF#refs/tags/v}
          workspace=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$workspace"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: aarch64-apple-darwin, os: macos-26, builder: cargo}
          - {target: x86_64-apple-darwin, os: macos-26, builder: cargo}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-26.04, builder: zigbuild}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-26.04, builder: zigbuild}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: ${{ matrix.builder == 'zigbuild' && 'rust zig cargo-binstall cargo:cargo-zigbuild' || 'rust' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked -p ruxel-cli --target ${{ matrix.target }}
      - name: Build with Zig
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked -p ruxel-cli --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          archive="ruxel-${VERSION}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" ruxel
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruxel-${{ matrix.target }}
          path: ruxel-*.tar.gz*

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-26.04
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Require complete platform set
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            test -f "artifacts/ruxel-${VERSION}-${target}.tar.gz"
            test -f "artifacts/ruxel-${VERSION}-${target}.tar.gz.sha256"
          done
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --title "Ruxel ${VERSION}" --generate-notes artifacts/ruxel-*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tailrocks/homebrew-ruxel
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Rewrite stable formula
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          arm_macos=$(cat artifacts/ruxel-${VERSION}-aarch64-apple-darwin.tar.gz.sha256)
          x86_macos=$(cat artifacts/ruxel-${VERSION}-x86_64-apple-darwin.tar.gz.sha256)
          arm_linux=$(cat artifacts/ruxel-${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256)
          x86_linux=$(cat artifacts/ruxel-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256)
          cat > tap/Formula/ruxel.rb <<EOF
          class Ruxel < Formula
            desc "Fast Rust executor for a closed Ansible workload"
            homepage "https://github.com/tailrocks/ruxel"
            version "${VERSION}"
            license "Apache-2.0"
            on_macos do
              on_arm do
                url "https://github.com/tailrocks/ruxel/releases/download/v${VERSION}/ruxel-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_macos}"
              end
              on_intel do
                url "https://github.com/tailrocks/ruxel/releases/download/v${VERSION}/ruxel-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${x86_macos}"
              end
            end
            on_linux do
              on_arm do
                url "https://github.com/tailrocks/ruxel/releases/download/v${VERSION}/ruxel-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${arm_linux}"
              end
              on_intel do
                url "https://github.com/tailrocks/ruxel/releases/download/v${VERSION}/ruxel-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${x86_linux}"
              end
            end
            conflicts_with "tailrocks/ruxel/ruxel-preview", because: "stable and preview install same binary"
            def install
              bin.install "ruxel"
            end
            test do
              system "#{bin}/ruxel", "--version"
            end
          end
          EOF
      - name: Update tap
        working-directory: tap
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git add Formula/ruxel.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ruxel ${VERSION}"
          git push
