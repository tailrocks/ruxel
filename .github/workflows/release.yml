  build:
    name: Build / ${{ matrix.target }}
    needs: [verify, release-github-docker-tools-fixtures-docker, release-github-rust-policy, release-github-rust-ruxel-agent, release-github-rust-ruxel-cli, release-github-rust-ruxel-core, release-github-rust-ruxel-proto, release-github-rust-ruxel-spec-extract, release-velnor-docker-tools-fixtures-docker, release-velnor-rust-policy, release-velnor-rust-ruxel-agent, release-velnor-rust-ruxel-cli, release-velnor-rust-ruxel-core, release-velnor-rust-ruxel-proto, release-velnor-rust-ruxel-spec-extract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            lane: github
            runner: macos-15
          - target: x86_64-apple-darwin
            lane: github
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@752f6da981b30b774e87407362c291ec2f349ef3
        with:
          rev: 752f6da981b30b774e87407362c291ec2f349ef3
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=752f6da981b30b774e87407362c291ec2f349ef3" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: mbx build --locked --release --package ruxel-cli --bin ruxel --target "${{ matrix.target }}"
      - name: Package release binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          velnor-workflow release package-binary --target "${{ matrix.target }}" --version "${VERSION#v}" --package ruxel-cli --binary ruxel
      - name: Attest release artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Control / Publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: github-*
          merge-multiple: true
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Verify archive checksums
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes

# Release tags are cut from the protected main branch.
