      - "tools/spec-extract/examples/**"
      - "tools/spec-extract/src/**"
      - "tools/spec-extract/tests/**"
  workflow_dispatch:

concurrency:
  group: preview-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Preview / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            lane: github
            runner: macos-15
          - target: x86_64-apple-darwin
            lane: github
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@03f9409b3f649a8973169dde0ebba3fe58a92ac9
        with:
          rev: 03f9409b3f649a8973169dde0ebba3fe58a92ac9
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=03f9409b3f649a8973169dde0ebba3fe58a92ac9" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Provision Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add 'x86_64-unknown-linux-musl' 'aarch64-apple-darwin' 'x86_64-apple-darwin' 'aarch64-unknown-linux-gnu' 'x86_64-unknown-linux-gnu'
      - name: Save Rust toolchain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rustup-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build preview binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: mbx build --locked --release --package ruxel-cli --bin ruxel --target "${{ matrix.target }}"
      - name: Package preview binary
        run: velnor-workflow release package-binary --target "${{ matrix.target }}" --version preview --package ruxel-cli --binary ruxel
      - name: Attest preview artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish rolling preview
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-preview
    permissions:
      contents: write
    steps:
      - name: Download preview artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: github-*
          merge-multiple: true
      - name: Verify preview provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Replace rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title "Rolling preview"
          gh release edit preview --target "${{ github.sha }}" --prerelease
          gh release upload preview dist/* --clobber
