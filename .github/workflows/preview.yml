name: Preview
run-name: Preview · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".cargo/audit.toml"
      - ".cargo/deny.toml"
