  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [plan, velnor-lane-admission, github-docker-tools-fixtures-docker, velnor-docker-tools-fixtures-docker, prepare-cargo, github-rust-policy, velnor-rust-policy, github-rust-ruxel-agent, velnor-rust-ruxel-agent, github-rust-ruxel-cli, velnor-rust-ruxel-cli, github-rust-ruxel-core, velnor-rust-ruxel-core, github-rust-ruxel-proto, velnor-rust-ruxel-proto, github-rust-ruxel-spec-extract, velnor-rust-ruxel-spec-extract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job velnor-lane-admission)"
          case "$result" in
            success|skipped) ;;
            *) echo "required CI prerequisite velnor-lane-admission did not pass: $result" >&2; exit 1 ;;
          esac
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",docker-tools-fixtures-docker,"* ]]; then
            result="$(result_for_job github-docker-tools-fixtures-docker)"
            case "$result" in
              success) ;;
              *) echo "selected CI job github-docker-tools-fixtures-docker did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job github-docker-tools-fixtures-docker)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-docker-tools-fixtures-docker failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",docker-tools-fixtures-docker,"* ]]; then
            result="$(result_for_job velnor-docker-tools-fixtures-docker)"
            if [[ "$FORK_PR" == true ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job velnor-docker-tools-fixtures-docker did not pass: $result" >&2; exit 1 ;;
              esac
            else
