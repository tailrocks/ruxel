






syntax = "proto3";

package ruxel.v1;





message Envelope {
  oneof msg {
    Hello hello = 1;
    Plan plan = 2;
    PlanPatch plan_patch = 3;
    Resume resume = 4;
    Done done = 5;
  }
}


message Hello {
  uint32 proto_version = 1;
  string run_id = 2;
  bool check_mode = 3;
  bool diff_mode = 4;
  bool no_cache = 5;
}





message Plan {
  repeated RenderedTask tasks = 1;
  repeated string blobs_referenced = 2;
}



message PlanPatch {
  repeated RenderedTask tasks = 1;
}



message Resume {
  uint64 task_id = 1;
  bool abort = 2;
}


message Done {}





message RenderedTask {
  uint64 task_id = 1;
  string name = 2;
  string module = 3;
  bool rendered = 4;
  repeated Iteration iterations = 5;
  bool check_mode_override = 6;
  bool no_log = 7;
  string become_user = 8;
  map<string, string> environment = 9;


  bool halt_on_failure = 10;
  bool force_check_mode = 11;
}

message Iteration {
  string item_label = 1;
  bytes params_json = 2;
  string free_form = 3;



  string ledger_key = 4;
}





message Event {
  oneof msg {
    HelloAck hello_ack = 1;
    BlobsNeeded blobs_needed = 2;
    TaskStart task_start = 3;
    TaskResult task_result = 4;
    PauseRequest pause_request = 5;
    Log log = 6;
    CrashReport crash = 7;
  }
}


message HelloAck {
  string agent_version = 1;
  uint32 proto_version = 2;
  Facts facts = 3;


  uint64 ledger_generation = 4;
}


message Facts {
  string default_ipv4_interface = 1;
  string distribution_release = 2;
  string architecture = 3;
  string hostname = 4;
}




message BlobsNeeded {
  repeated string missing = 1;
}

message TaskStart {
  uint64 task_id = 1;
  string item_label = 2;
}

message TaskResult {
  uint64 task_id = 1;
  string status = 2;
  bool changed = 3;
  bytes result_json = 4;
  string diff = 5;
  uint64 elapsed_ms = 6;
  string item_label = 7;
}



message PauseRequest {
  uint64 task_id = 1;
  string prompt = 2;
}

message Log {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
  }
  Level level = 1;
  string message = 2;
}


message CrashReport {
  string message = 1;
  string location = 2;
}
