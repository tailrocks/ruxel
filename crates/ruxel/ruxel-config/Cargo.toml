[package]
name = "ruxel-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "check-deny-inputs"
path = "src/bin/check_deny_inputs.rs"

[features]
# Gates the dual-evaluator suites. The suites demand the official Pkl CLI
# (see tests/dual_evaluator.rs and tests/dual_evaluator_systemd.rs) and fail
# loudly without it, and Velnor's
# rust lanes synthesize their own nextest command from the stack config —
# no provisioning hook of theirs runs the repo's test task — so a
# default-feature run must not compile the targets. The runners that
# provision the CLI opt in explicitly: the dual-evaluator check task (and
# its CI job) passes the feature to cargo test, and the local test task
# provisions the CLI and runs with --all-features.
dual-evaluator = []

[[test]]
name = "dual_evaluator"
required-features = ["dual-evaluator"]

[[test]]
name = "dual_evaluator_systemd"
required-features = ["dual-evaluator"]

[dependencies]
blake3.workspace = true
ruxel-guard = { path = "../ruxel-guard", version = "0.1.0" }
rustix.workspace = true

pklr = { git = "https://github.com/donbeave/pklr", rev = "9843caeb1f56499896c78057fd2560e468978ab1", version = "=5.2.3", default-features = false, features = ["eval-core", "native-io", "miette-diagnostics"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.2.1"
toml_edit = { version = "0.25.18", default-features = false, features = ["parse"] }

thiserror.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[lints]
workspace = true
