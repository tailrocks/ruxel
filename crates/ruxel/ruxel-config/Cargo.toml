[package]
name = "ruxel-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "check-deny-inputs"
path = "src/bin/check_deny_inputs.rs"

[features]
# Gates the dual-evaluator suites. The suites demand the official Pkl CLI
# (see tests/dual_evaluator.rs and tests/dual_evaluator_systemd.rs) and fail
# loudly without it, and Velnor's
# rust lanes synthesize their own nextest command from the stack config —
# no provisioning hook of theirs runs the repo's test task — so a
# default-feature run must not compile the targets. The runners that
# provision the CLI opt in explicitly: the dual-evaluator check task (and
# its CI job) passes the feature to cargo test, and the local test task
# provisions the CLI and runs with --all-features.
dual-evaluator = []

# Prepares the switch from the `donbeave/pklr` fork to upstream `jdx/pklr`
# without changing any behaviour: the fork stays the default dependency and
# the default build does not even compile the upstream crate. The feature
# turns on `src/upstream_pklr.rs`, which documents the capability families
# upstream still lacks and exercises the parts of the upstream API that exist
# today (glob expansion, `modulepath:` module search and a source evaluation
# through `EvalCapabilities`). The alias is pinned at post-#419 upstream
# main (`d7d0156`), which carries #420 (`modulepath:` resources), #421
# (`resource_*` capability hooks) and #423 (`GlobAccess`/`expand_glob_with`).
# The flip of the default dependency stays blocked: upstream still lacks
# `ModuleSource`/`set_module_source`, a public `eval_source_json_blocking`,
# and `Target::ModulePath`/`add_module_path_source`/`add_module_path_directory`
# (jdx/pklr#419 gaps 3 and 4; see `src/upstream_pklr.rs`).
pklr-upstream-path = ["dep:pklr-upstream"]

[[test]]
name = "dual_evaluator"
required-features = ["dual-evaluator"]

[[test]]
name = "dual_evaluator_systemd"
required-features = ["dual-evaluator"]

[dependencies]
blake3.workspace = true
ruxel-guard = { path = "../ruxel-guard", version = "0.1.0" }
rustix.workspace = true

pklr = { git = "https://github.com/donbeave/pklr", rev = "9843caeb1f56499896c78057fd2560e468978ab1", version = "=5.2.3", default-features = false, features = ["eval-core", "native-io", "miette-diagnostics"] }

# Upstream `jdx/pklr` under an alias, so both crates coexist in the lockfile
# and the switch can be prepared without moving the default dependency. The
# same crate name from two sources is fine; the alias keeps the two apart.
# Optional: the default build never compiles it. The revision is upstream
# main after jdx/pklr#420/#421/#423 (the #419 fixes that landed).
pklr-upstream = { package = "pklr", version = "5.2.3", git = "https://github.com/jdx/pklr", rev = "d7d0156a1fc2b4d30cf17eea54741c8c7e88dab9", default-features = false, features = ["eval-core", "native-io", "miette-diagnostics"], optional = true }
serde.workspace = true
serde_json.workspace = true
toml = "1.2.1"
toml_edit = { version = "0.25.18", default-features = false, features = ["parse"] }

thiserror.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[lints]
workspace = true
