[package]
name = "ruxel-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "check-deny-inputs"
path = "src/bin/check_deny_inputs.rs"

[dependencies]
blake3.workspace = true
ruxel-guard = { path = "../ruxel-guard", version = "0.1.0" }
rustix.workspace = true

pklr = { git = "https://github.com/donbeave/pklr", rev = "c4c5b51b0f393de7296a3a7b0f8cdc5b1e6d1146", version = "=5.2.3", default-features = false, features = ["eval-core", "native-io", "miette-diagnostics"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.2.1"
toml_edit = { version = "0.25.18", default-features = false, features = ["parse"] }

thiserror.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[lints]
workspace = true
