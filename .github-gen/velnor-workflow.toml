schema = 1

[generator]
repository = "tailrocks/ruxel"
revision = "e05aee6de1d1614d752b4d1b1d26a49ac2c5ef91"

[workflow]
runners = "both"
automatic = "both"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-24.04"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_branch = "main"

[release]
enabled = true
reason = "Publish signed ruxel CLI archives and update the Homebrew tap."
kind = "rust-binary"
package = "ruxel-cli"
binary = "ruxel"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
source_repository = "tailrocks/ruxel"

[[declare]]
primitive = "release"
file = "release.yml"

[[declare]]
primitive = "preview"
file = "preview.yml"

# Note: rust-toolchain.toml targets are patched in the migration branch to match release targets.
