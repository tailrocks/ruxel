[workspace]
members = [
    "crates/ruxel/ruxel",
    "crates/ruxel/ruxel-agent",
    "crates/ruxel/ruxel-config",
    "crates/ruxel/ruxel-engine",
    "crates/ruxel/ruxel-proto",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/tailrocks/ruxel"
homepage = "https://github.com/tailrocks/ruxel"

[workspace.dependencies]
ruxel-config = { path = "crates/ruxel/ruxel-config", version = "0.1.0" }
ruxel-proto = { path = "crates/ruxel/ruxel-proto", version = "0.1.0" }

base64 = "0.22"
percent-encoding = "2"
pbkdf2 = "0.13"
regex-lite = "0.1"
rsblkid = "=0.4.1"
rustix = { version = "1.1.6", features = ["fs"] }
rustix-linux-procfs = "0.1.1"
libc = "0.2"
futures-util = "0.3"
anyhow = "1.0.104"
blake3 = "1.8.7"
openssh-sftp-client = "0.15.12"
clap = { version = "4.6.7", features = ["derive", "color", "env", "help", "usage"] }
hmac = "0.13.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "time", "process", "signal", "sync"] }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.test.package."sha2:0.11.1"]
opt-level = 3
