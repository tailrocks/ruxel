# Repository policy, enforced by asamarts/alint as its own CI job.
# Policy: tailrocks/rust-repository-policy rust-strict-v1 at v0.1.3.
# HTTPS extends cannot nest extends, so the profile's eight modules are
# listed here directly, in the profile's order, each SRI-pinned.
version: 1
respect_gitignore: false

ignore:
  # Build output.
  - "target/**"
  - ".cache/**"
  # Third-party MIT source, preserved for attribution and a reviewable patch.
  # Provenance and the exact upstream delta are in vendor/pklr/VENDORED.md.
  - "vendor/pklr/src/**"
  # Deleted or rewritten by the Ruxel rewrite (§S8). One path per line:
  # each line is removed in the commit that deletes or rewrites the
  # path. Never add live code here.
  - "tools/**"
  - "crates/ruxel/ruxel/build.rs"
  - "crates/ruxel/ruxel-agent/src/main.rs"
  - "crates/ruxel/ruxel-agent/src/facts.rs"
  - "crates/ruxel/ruxel-agent/src/modules/apt.rs"
  - "crates/ruxel/ruxel-agent/src/modules/apt_repository.rs"
  - "crates/ruxel/ruxel-agent/src/modules/authorized_key.rs"
  - "crates/ruxel/ruxel-agent/src/modules/blockinfile.rs"
  - "crates/ruxel/ruxel-agent/src/modules/command.rs"
  - "crates/ruxel/ruxel-agent/src/modules/copy.rs"
  - "crates/ruxel/ruxel-agent/src/modules/get_url.rs"
  - "crates/ruxel/ruxel-agent/src/modules/lvg.rs"
  - "crates/ruxel/ruxel-agent/src/modules/slurp.rs"
  - "crates/ruxel/ruxel-agent/src/modules/sysctl.rs"
  - "crates/ruxel/ruxel-agent/src/modules/systemd.rs"
  - "crates/ruxel/ruxel-agent/src/modules/user.rs"
  - "crates/ruxel/ruxel-agent/tests/protocol.rs"

extends:
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/layout.yml#sha256-1cea31bc9e3ddb9604108d972017eae63d6222ca534b5a8d3b3e7aab686e1d51
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/cargo.yml#sha256-b16eceea03709ab24ba7dc7d13ebe8e8890dda891c11bdabbd3a429b7d59d85c
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/tests.yml#sha256-8afde3ff3a62cfd767dd8ea2d0b0e1123455392cedfb86539912569607e7bd32
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/docs.yml#sha256-4f92baceb6a4344c85d5ced9942ee2cc21dab35374ae7610ad2a0ab42943dbe2
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/toolchain.yml#sha256-448732f88d93932fb2ba9ffaa48a0fa8e2294787fdd5cfd9367629bbbe39166b
    except:
      # The policy pins the channel to one exact release (1.98.1 at
      # v0.1.3). R14 requires the newest stable; the mise and CI parity
      # rules below still enforce one consistent pin.
      - toolchain-channel-pinned
      # mise rust entry is a table in the operator layout; velnor-actions
      # generation enforces the rust-toolchain mirror.
      - toolchain-mise-parity
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/ci.yml#sha256-77931acd430539c2dd0832ac9a891a0056ba46cb45ff4d4fa1fed753990c9db9
    except:
      # CI is generated by velnor-actions (ubuntu-26.04 jobs, no `build`
      # job) and is never hand-edited.
      - ci-build-runs-on
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/renovate.yml#sha256-8f2d6407aa262b96ec61d4895c144470d062a4066ccab3348ba6db15bb55ed4e
  - url: https://raw.githubusercontent.com/tailrocks/rust-repository-policy/v0.1.3/modules/size.yml#sha256-f053c5745e5784afa5ea1e18dfb9ddcdec711ef3c479951222604de070c2368f
  # The bundled profiles velnor-new uses (stricter is preferred).
  - alint://bundled/oss-baseline@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/rust@v1
  - alint://bundled/hygiene/lockfiles@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # Each AGENTS.md has a sibling CLAUDE.md regular file with the
  # pointer body (tailrocks policy; alint has no native rule for it).
  - id: claude-is-agents-pointer
    kind: command
    paths:
      include: ["**/AGENTS.md"]
      exclude: [".github/**"]
    command:
      - sh
      - -c
      - 'dir=$(dirname "$1") && test -f "$dir/CLAUDE.md" && test ! -L "$dir/CLAUDE.md" && printf "@AGENTS.md\n" | cmp -s - "$dir/CLAUDE.md"'
      - alint-claude-pointer
      - "{path}"
    level: error
    message: "Each AGENTS.md must have a sibling CLAUDE.md regular file with the @AGENTS.md pointer body"
