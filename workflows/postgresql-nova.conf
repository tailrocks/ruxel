data_directory = '/var/lib/postgresql/19/main'

hba_file = '/etc/postgresql/19/main/pg_hba.conf'
ident_file = '/etc/postgresql/19/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/19-main.pid'

listen_addresses = '*'
port = 40000

unix_socket_directories = '/var/run/postgresql'

ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'

dynamic_shared_memory_type = posix

max_connections = 1000
reserved_connections = 2
superuser_reserved_connections = 3

# Clients reach this server across the public network, so an idle connection
# sits behind NAT and firewall state that expires long before PostgreSQL would
# notice. When that state is dropped the client keeps a socket it believes is
# open, and the next query on it fails with ECONNRESET. Lightdash authorizes
# every API token by querying this database, so on 2026-08-16 a pool holding
# connections idle for more than six days turned that reset into
# "401 Failed to authorize user" and cost eight CSV deliveries.
#
# Send keepalives long before any plausible middlebox timeout, so an idle
# connection stays reachable instead of being silently severed. This probes an
# idle socket after five minutes rather than the two-hour default.
tcp_keepalives_idle = 300
tcp_keepalives_interval = 30
tcp_keepalives_count = 4

# 25–40% of available RAM.
shared_buffers = 4GB

# MultiXact SLRU: verify dual-side fingerprint digests (processor-compare) thrash
# MultiXactOffsetSLRU under full writers with defaults (16/32 buffers). Raise so
# concurrent account heap visibility checks stay in memory. PG 17+ units are 8kB
# buffers; 128/256 ≈ 1MB/2MB — still tiny vs shared_buffers, large win for compare.
multixact_offset_buffers = 128
multixact_member_buffers = 256

# MultiXact/XID cleanup is a correctness safeguard, not optional tuning.
# Keep the defaults explicit so Ansible cannot silently drift to a disabled
# cleanup policy. Application lock waits are bounded in code; this server-side
# guard also kills abandoned idle transactions.
autovacuum = on
track_counts = on
autovacuum_multixact_freeze_max_age = 400000000
vacuum_multixact_freeze_table_age = 150000000
vacuum_multixact_freeze_min_age = 5000000
vacuum_multixact_failsafe_age = 1600000000
idle_in_transaction_session_timeout = 300000

# 50–75% of system RAM.
effective_cache_size = 50GB

# 4–64MB depending on the complexity of queries. This is per operation, per query.
work_mem = 84MB

# 256MB–2GB, depending on available RAM and the size of your DB.
maintenance_work_mem = 2GB

# 0.9 or higher.
checkpoint_completion_target = 0.9

# Increase to 10min or more to reduce write pressure.
checkpoint_timeout = 15min

min_wal_size = 2GB

# Increase to allow longer times between checkpoints (e.g., 2GB–4GB or more).
max_wal_size = 8GB

# Set to at least 16MB for high write volumes.
wal_buffers = 64MB

synchronous_commit = on

autovacuum_vacuum_cost_limit = 1800
autovacuum_vacuum_cost_delay = 5ms

max_parallel_workers = 32

# Increase from default (e.g., 4–8).
max_parallel_workers_per_gather = 16

# Controls parallel workers for maintenance operations (CREATE INDEX, REINDEX, VACUUM)
# Should be <= max_parallel_workers
max_parallel_maintenance_workers = 16

parallel_setup_cost = 200
parallel_tuple_cost = 0.02

max_worker_processes = 32

# NVMe SSD: 100–300
effective_io_concurrency = 300

# NVMe SSD: 1.0 – 1.3
random_page_cost = 1.3

# This helps balance planner cost models more accurately for SSD/NVMe systems.
seq_page_cost = 0.9

huge_pages = off

io_method = 'io_uring'

cluster_name = 'chainargos'

datestyle = 'iso, mdy'
timezone = 'UTC'

lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

default_text_search_config = 'pg_catalog.english'

log_timezone = 'UTC'

log_line_prefix = '%t [%p] %q%u@%d '		# special values:
					#   %a = application name
					#   %u = user name
					#   %d = database name
					#   %r = remote host and port
					#   %h = remote host
					#   %b = backend type
					#   %p = process ID
					#   %P = process ID of parallel group leader
					#   %t = timestamp without milliseconds
					#   %m = timestamp with milliseconds
					#   %n = timestamp with milliseconds (as a Unix epoch)
					#   %Q = query ID (0 if none or not computed)
					#   %i = command tag
					#   %e = SQL state
					#   %c = session ID
					#   %l = session line number
					#   %s = session start timestamp
					#   %v = virtual transaction ID
					#   %x = transaction ID (0 if none)
					#   %q = stop here in non-session
					#        processes
					#   %% = '%'
					# e.g. '<%u%%%d> '

shared_preload_libraries = 'pg_stat_statements,pg_parquet'

pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
pg_stat_statements.save = on

include_dir = 'conf.d'
